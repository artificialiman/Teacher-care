<title>TENDER-ADMIN • Complete Student Credentials Portal</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --accent: #4f8ef7;
    --text: #e8eaf0;
    --muted: #6b7080;
    --code: #a8d8a8;
    --radius: 12px;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Georgia', serif;
    --font-mono: 'SF Mono', 'Fira Code', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 28px 20px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 38px;
    position: relative;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff 0%, #8ab3ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  header h1 i {
    background: none;
    -webkit-background-clip: unset;
    background-clip: unset;
    color: var(--accent);
    font-size: 1.9rem;
  }

  header p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  .stats-badge {
    margin-top: 16px;
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .stats-badge span strong {
    color: var(--accent);
    font-family: var(--font-mono);
    background: rgba(79, 142, 247, 0.15);
    padding: 3px 10px;
    border-radius: 30px;
    font-weight: 600;
  }

  .wrapper {
    max-width: 1300px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  details {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: all 0.2s ease;
  }

  details[open] {
    border-color: var(--accent);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  }

  summary {
    padding: 16px 22px;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 1rem;
    font-weight: 500;
    user-select: none;
    background: rgba(0, 0, 0, 0.2);
    transition: background 0.2s;
  }

  summary:hover {
    background: rgba(79, 142, 247, 0.05);
  }

  summary::-webkit-details-marker { display: none; }

  summary .label {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  summary .class-title {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  summary .badge {
    background: var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 30px;
    font-weight: 500;
  }

  details[open] summary .badge {
    background: var(--accent);
    color: #fff;
  }

  summary .chevron {
    color: var(--muted);
    font-size: 0.85rem;
    transition: transform 0.2s;
  }

  details[open] summary .chevron {
    transform: rotate(180deg);
  }

  .table-container {
    overflow-x: auto;
    padding: 0 4px 8px 4px;
  }

  .student-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  .student-table th {
    text-align: left;
    padding: 14px 16px 10px 16px;
    font-size: 0.7rem;
    font-family: var(--font-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.15);
  }

  .student-table td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    vertical-align: middle;
  }

  .student-table tr:last-child td {
    border-bottom: none;
  }

  .student-table tr:hover td {
    background: rgba(79, 142, 247, 0.05);
  }

  .sn-col {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    width: 48px;
    font-weight: 500;
  }

  .student-id-code {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: #9aa9cf;
    font-weight: 500;
    letter-spacing: 0.2px;
  }

  .student-fullname {
    font-weight: 500;
    color: var(--text);
  }

  .password-value {
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--code);
    background: rgba(168, 216, 168, 0.08);
    padding: 4px 10px;
    border-radius: 24px;
    display: inline-block;
    font-size: 0.8rem;
    letter-spacing: 0.3px;
    border: 0.5px solid rgba(168, 216, 168, 0.25);
  }

  .footer-note {
    text-align: center;
    margin-top: 48px;
    font-size: 0.75rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 24px;
  }

  @media (max-width: 680px) {
    body {
      padding: 18px 12px 40px;
    }
    summary {
      padding: 12px 16px;
    }
    .student-table th, .student-table td {
      padding: 10px 10px;
    }
    .password-value {
      font-size: 0.7rem;
      padding: 2px 8px;
    }
  }
</style>
