<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCC — Admin Broadsheet 2025/2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c14;--s1:#141720;--s2:#1a1f2e;--s3:#232838;
  --bd:#2d3245;--txt:#dde1f0;--t2:#7a8299;--t3:#4a5070;
  --acc:#4f8ef7;--grn:#22c55e;--red:#ef4444;--amb:#f59e0b;
  --fix0:#111420;--fix1:#13162a;--ev0:#161b26;--ev1:#14182a;--ev2:#161c2e;
}
html,body{height:100%;background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;overflow:hidden}

/* HDR */
.hdr{position:fixed;inset:0 0 auto 0;height:46px;z-index:100;
  background:var(--s1);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 14px;gap:12px}
.brand{font-weight:900;font-size:15px;letter-spacing:2.5px;
  background:linear-gradient(110deg,#fff,var(--acc));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand b{font-size:9px;font-weight:400;color:var(--t3);
  display:block;letter-spacing:2px;text-transform:uppercase;margin-top:-2px}
.vsep{width:1px;height:20px;background:var(--bd)}
.tg{display:flex;align-items:center;gap:6px}
.tg label{font-size:10px;color:var(--t3);letter-spacing:.5px;text-transform:uppercase}
select{background:var(--bg);color:var(--txt);border:1px solid var(--bd);
  border-radius:5px;padding:4px 8px;font-size:11px;font-family:inherit;cursor:pointer}
select:focus{outline:none;border-color:var(--acc)}

/* TABS */
.tabbar{position:fixed;top:46px;inset-inline:0;height:36px;z-index:90;
  background:var(--s1);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:3px;padding:0 10px;
  overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{background:transparent;color:var(--t2);border:1px solid transparent;
  border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700;
  cursor:pointer;white-space:nowrap;letter-spacing:.8px}
.tab:hover{background:var(--s3);color:var(--txt)}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}

/* WORKSPACE */
.ws{position:fixed;top:82px;inset-inline:0;bottom:0;overflow:hidden}

/* PANEL */
.panel{height:100%;display:flex;flex-direction:column}
.panel[hidden]{display:none}

/* PANEL BAR */
.pbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 12px;background:var(--s2);border-bottom:1px solid var(--bd)}
.cls-badge{background:var(--acc);color:#fff;font-weight:800;font-size:12px;
  padding:2px 9px;border-radius:3px;letter-spacing:.8px}
.cls-meta{color:var(--t3);font-size:10px;flex:1}
.acts{display:flex;align-items:center;gap:5px;margin-left:auto}

/* save status */
.save-status{font-size:10px;color:var(--t3);min-width:80px;text-align:right}
.save-status.dirty{color:var(--amb)}
.save-status.saved{color:var(--grn)}

/* max inputs */
.max-row{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--t3)}
.max-row input{width:36px;background:var(--bg);color:var(--txt);border:1px solid var(--bd);
  border-radius:3px;padding:2px 4px;text-align:center;font-size:10px;font-family:inherit}
.max-row input:focus{outline:none;border-color:var(--acc)}

.btn{padding:4px 10px;font-size:11px;font-weight:600;border-radius:3px;
  cursor:pointer;letter-spacing:.4px;border:1px solid}
.b-sv{background:var(--s3);color:var(--txt);border-color:var(--bd)}
.b-sv:hover{background:var(--bd)}
.b-cs{background:rgba(34,197,94,.12);color:var(--grn);border-color:rgba(34,197,94,.3)}
.b-cs:hover{background:rgba(34,197,94,.22)}
.b-cl{background:rgba(239,68,68,.12);color:var(--red);border-color:rgba(239,68,68,.3)}
.b-cl:hover{background:rgba(239,68,68,.22)}

/* SCROLL */
.tscroll{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--s3) transparent}
.tscroll::-webkit-scrollbar{width:5px;height:5px}
.tscroll::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}

/* TABLE */
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
thead{position:sticky;top:0;z-index:30}

/* TH */
th{background:var(--s2);color:var(--t2);font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;padding:5px 3px;
  text-align:center;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);
  white-space:nowrap}
th.sh{color:var(--txt);background:#15192e;font-size:9.5px;
  border-left:2px solid var(--bd)!important;padding:5px 6px}
.h2 .sc{color:rgba(110,170,255,.8)}
.h2 .se{color:rgba(170,130,255,.8)}
.h2 .st{color:var(--t3)}
th.sk,th.sp{background:#111b30!important;color:var(--acc)!important}

/* STICKY COLS */
th.c0,td.c0{position:sticky;left:0;z-index:20;width:32px;min-width:32px}
th.c1,td.c1{position:sticky;left:32px;z-index:20;min-width:170px;width:170px;max-width:170px}
thead th.c0,thead th.c1{z-index:40}

/* TD */
tbody tr{background:var(--s1)}
tbody tr:nth-child(even){background:var(--ev0)}
td{padding:2px 3px;text-align:center;vertical-align:middle;font-size:11px;
  border-bottom:1px solid #1c2235;border-right:1px solid #1c2235}
td.c0{background:var(--fix0);color:var(--t3);font-size:10px;font-weight:600}
td.c1{background:var(--fix1);text-align:left;padding-left:6px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr:nth-child(even) td.c0{background:var(--ev1)}
tr:nth-child(even) td.c1{background:var(--ev2)}
td.tl{border-left:2px solid #252a40!important}

/* INPUTS */
input[type=number]{width:34px;background:rgba(79,142,247,.07);color:var(--txt);
  border:1px solid transparent;border-radius:3px;padding:2px 1px;
  text-align:center;font-size:11px;font-family:inherit;
  -moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]:focus{outline:none;background:rgba(79,142,247,.2);border-color:rgba(79,142,247,.65)}
input.ca:focus{border-color:rgba(110,175,255,.7)}
input.ex:focus{border-color:rgba(170,130,255,.7)}
input.over{border-color:var(--red)!important;background:#2d1515!important}

/* COMPUTED */
td.tot{color:var(--t2);font-weight:600;min-width:26px}
td.sum{background:#121c32;font-weight:700;color:var(--txt);min-width:40px}
tr:nth-child(even) td.sum{background:#141e36}
td.grd{min-width:32px;font-weight:800;font-size:11px}
.gA1{background:#163a1a;color:#4ade80}
.gB2{background:#18304e;color:#60a5fa}
.gB3{background:#1a2e4a;color:#93c5fd}
.gC4{background:#3a2e0c;color:#fde047}
.gC5{background:#36280a;color:#fbbf24}
.gC6{background:#312208;color:#f59e0b}
.gD7{background:#38200e;color:#fb923c}
.gE8{background:#381414;color:#f87171}
.gF9{background:#280a0a;color:#fca5a5}

/* TOAST */
.toast{position:fixed;bottom:16px;right:16px;z-index:999;
  background:var(--s2);border:1px solid var(--bd);border-radius:8px;
  padding:9px 15px;font-size:12px;display:none;
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{display:block}
.toast.ok{border-color:rgba(34,197,94,.5);color:var(--grn)}
.toast.er{border-color:rgba(239,68,68,.5);color:var(--red)}

@media print{
  .hdr,.tabbar,.pbar{display:none!important}
  .ws{position:static;overflow:visible}
  .panel[hidden]{display:flex!important}
  .tscroll{overflow:visible}
  table{font-size:6pt}
  th,td{background:#fff!important;color:#000!important;border-color:#ccc!important}
  td.c0,td.c1{position:static!important}
  input{border:1px solid #bbb!important;background:transparent!important;color:#000!important}
}
</style>
</head>

/* ── GRADE: Nigerian WAEC on raw total out of maxTotal ── */
function grade(total, maxTotal) {
  if (!total || !maxTotal) return '';
  const pct = (total / maxTotal) * 100;
  if (pct >= 75) return 'A1';
  if (pct >= 70) return 'B2';
  if (pct >= 65) return 'B3';
  if (pct >= 60) return 'C4';
  if (pct >= 55) return 'C5';
  if (pct >= 50) return 'C6';
  if (pct >= 45) return 'D7';
  if (pct >= 40) return 'E8';
  return 'F9';
}

/* ── TOAST ── */
let _tt;
function toast(msg, type) {
  const el = document.getElementById('toast');
  clearTimeout(_tt);
  el.className = 'toast show ' + (type || 'ok');
  el.textContent = msg;
  _tt = setTimeout(() => el.className = 'toast', 2800);
}

/* ── STORAGE KEY ── */
function lsKey(cls) {
  return 'tcbs|' + cls + '|' + document.getElementById('tsel').value;
}

/* ── GET MAX VALUES FROM PANEL ── */
function getMaxCA(panel)   { const i = panel.querySelector('.max-ca');   return i ? (+i.value || 30) : 30; }
function getMaxExam(panel) { const i = panel.querySelector('.max-exam'); return i ? (+i.value || 70) : 70; }

/* ── SAVE ── */
function saveLS(cls) {
  const clsId = cls.replace(/ /g, '_');
  const panel = document.getElementById('P' + clsId);
  const tbl   = document.getElementById('T' + clsId);
  if (!tbl) return;
  const d = { ca: {}, ex: {}, maxCA: getMaxCA(panel), maxExam: getMaxExam(panel) };
  tbl.querySelectorAll('input.ca').forEach(i => { if (i.value) d.ca[i.dataset.k] = i.value; });
  tbl.querySelectorAll('input.ex').forEach(i => { if (i.value) d.ex[i.dataset.k] = i.value; });
  try { localStorage.setItem(lsKey(cls), JSON.stringify(d)); } catch(e) {}
  // update status
  const ss = panel.querySelector('.save-status');
  if (ss) { ss.textContent = 'Saved ' + new Date().toTimeString().slice(0,5); ss.className = 'save-status saved'; }
}

/* ── LOAD ── */
function loadLS(cls) {
  const clsId = cls.replace(/ /g, '_');
  const panel = document.getElementById('P' + clsId);
  const tbl   = document.getElementById('T' + clsId);
  if (!tbl) return;
  let d;
  try { d = JSON.parse(localStorage.getItem(lsKey(cls))); } catch(e) {}
  if (!d) { tbl.querySelectorAll('.tot,.sum').forEach(c => c.textContent = ''); tbl.querySelectorAll('.grd').forEach(c => { c.textContent = ''; c.className = 'grd'; }); return; }
  // restore max values
  if (d.maxCA   && panel) { const mc = panel.querySelector('.max-ca');   if (mc) mc.value = d.maxCA; }
  if (d.maxExam && panel) { const me = panel.querySelector('.max-exam'); if (me) me.value = d.maxExam; }
  tbl.querySelectorAll('input.ca').forEach(i => { i.value = (d.ca && d.ca[i.dataset.k]) || ''; });
  tbl.querySelectorAll('input.ex').forEach(i => { i.value = (d.ex && d.ex[i.dataset.k]) || ''; });
  tbl.querySelectorAll('tr.r').forEach(tr => calcRow(tr, panel));
  const ss = panel && panel.querySelector('.save-status');
  if (ss) { ss.textContent = 'Loaded'; ss.className = 'save-status saved'; }
}

/* ── CALC ROW: grades on subject-level total AND row sum ── */
function calcRow(tr, panel) {
  if (!panel) {
    const ws = tr.closest('.panel');
    panel = ws || tr.closest('.ws');
  }
  const maxCA   = getMaxCA(panel);
  const maxExam = getMaxExam(panel);
  const maxSubj = maxCA + maxExam;

  let sum = 0, n = 0;
  tr.querySelectorAll('input.ca').forEach(ca => {
    const ex  = tr.querySelector('input.ex[data-s="' + ca.dataset.s + '"]');
    const c   = +ca.value || 0;
    const e   = +(ex && ex.value) || 0;
    const t   = c + e;
    const tel = tr.querySelector('.tt[data-s="' + ca.dataset.s + '"]');
    if (tel) tel.textContent = t || '';
    if (t > 0) { sum += t; n++; }
  });

  const maxPossible = n * maxSubj;  // only count subjects with entries
  const se = tr.querySelector('.sum');
  const ge = tr.querySelector('.grd');
  if (se) se.textContent = sum || '';
  if (ge) {
    const g = sum ? grade(sum, maxPossible) : '';
    ge.textContent = g;
    ge.className   = 'grd' + (g ? ' g' + g : '');
  }
}

/* ── BUILD PANEL (lazy, once per class) ── */
function buildPanel(cls) {
  const clsId = cls.replace(/ /g, '_');
  const id    = 'P' + clsId;
  if (document.getElementById(id)) return;

  const data     = DB[cls];
  const students = data.s;
  const subjects = data.j;
  const ns = subjects.length, n = students.length;
  const tid = 'T' + clsId;

  /* thead */
  let r1 = '<tr class="h1"><th rowspan="2" class="c0">#</th><th rowspan="2" class="c1" style="text-align:left;padding-left:7px">STUDENT NAME</th>';
  let r2 = '<tr class="h2">';
  subjects.forEach(s => {
    r1 += `<th colspan="3" class="sh">${s}</th>`;
    r2 += '<th class="sc">CA</th><th class="se">EX</th><th class="st">TOT</th>';
  });
  r1 += '<th rowspan="2" class="sk">SUM</th><th rowspan="2" class="sp">GRD</th></tr>';
  r2 += '</tr>';

  /* tbody */
  let tbody = '';
  students.forEach(([sid, name], i) => {
    const ks = sid.replace(/-/g, '');
    let cells = '';
    subjects.forEach((_, j) => {
      const k = ks + '_' + j;
      cells += `<td class="tl"><input type="number" class="ca" min="0" max="99" data-k="${k}c" data-s="${j}" autocomplete="off"></td>`
             + `<td><input type="number" class="ex" min="0" max="99" data-k="${k}e" data-s="${j}" autocomplete="off"></td>`
             + `<td class="tot tt" data-s="${j}"></td>`;
    });
    tbody += `<tr class="r" data-s="${ks}" data-sid="${sid}"><td class="c0">${i+1}</td><td class="c1" title="${sid}">${name.replace(/</g,'&lt;')}</td>${cells}<td class="sum"></td><td class="grd"></td></tr>`;
  });

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = id;
  panel.hidden = true;
  panel.innerHTML = `
<div class="pbar">
  <span class="cls-badge">${cls}</span>
  <span class="cls-meta">${n} students &bull; ${ns} subjects</span>
  <div class="max-row">
    CA&thinsp;<input class="max-ca" type="number" value="30" min="1" max="100" title="Max CA score">&nbsp;
    Exam&thinsp;<input class="max-exam" type="number" value="70" min="1" max="100" title="Max exam score">
  </div>
  <div class="acts">
    <span class="save-status"></span>
    <button class="btn b-sv" onclick="doSave('${clsId}')">&#9889; Save</button>
    <button class="btn b-cs" onclick="doCSV('${clsId}')">&#8595; CSV</button>
    <button class="btn b-cl" onclick="doClear('${clsId}')">&#10005; Clear</button>
  </div>
</div>
<div class="tscroll">
  <table id="${tid}">
    <thead>${r1}${r2}</thead>
    <tbody>${tbody}</tbody>
  </table>
</div>`;

  document.getElementById('ws').appendChild(panel);

  /* ── INPUT: validate + recalc + debounced autosave ── */
  let _saveTimer;
  panel.addEventListener('input', function(e) {
    const inp = e.target;
    if (inp.tagName !== 'INPUT') return;
    const isCA  = inp.classList.contains('ca');
    const maxV  = isCA ? getMaxCA(panel) : getMaxExam(panel);
    let v = +inp.value;
    if (inp.value === '' || isNaN(v)) { inp.classList.remove('over'); }
    else {
      if (v < 0) { inp.value = v = 0; }
      if (v > maxV) { inp.value = v = maxV; inp.classList.add('over'); }
      else { inp.classList.remove('over'); }
    }
    const tr = inp.closest('tr.r');
    if (tr) calcRow(tr, panel);

    // mark dirty
    const ss = panel.querySelector('.save-status');
    if (ss && !ss.className.includes('dirty')) { ss.textContent = 'Unsaved'; ss.className = 'save-status dirty'; }

    // debounced save: 600ms after last keystroke
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => saveLS(cls), 600);
  });

  // max-field changes: regrade all rows
  panel.querySelector('.max-ca').addEventListener('change', () => {
    panel.querySelectorAll('tr.r').forEach(tr => calcRow(tr, panel));
  });
  panel.querySelector('.max-exam').addEventListener('change', () => {
    panel.querySelectorAll('tr.r').forEach(tr => calcRow(tr, panel));
  });
}

/* ── SHOW PANEL ── */
function showPanel(cls) {
  buildPanel(cls);
  document.querySelectorAll('.panel').forEach(p => p.hidden = true);
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  const panel = document.getElementById('P' + cls.replace(/ /g, '_'));
  if (panel) { panel.hidden = false; loadLS(cls); }
  const tab = document.querySelector('.tab[data-c="' + CSS.escape(cls) + '"]');
  if (tab) { tab.classList.add('on'); tab.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
}

/* ── ACTIONS ── */
window.doSave = function(clsId) {
  const cls = clsId.replace(/_/g, ' ');
  saveLS(cls);
  toast('Saved \u2713', 'ok');
};

window.doCSV = function(clsId) {
  const cls     = clsId.replace(/_/g, ' ');
  const term    = document.getElementById('tsel').options[document.getElementById('tsel').selectedIndex].text;
  const data    = DB[cls];
  const subjects = data.j;
  const tbl     = document.getElementById('T' + clsId);
  const panel   = document.getElementById('P' + clsId);
  if (!tbl) return;

  const maxCA   = getMaxCA(panel);
  const maxExam = getMaxExam(panel);
  const maxSubj = maxCA + maxExam;

  // Row 1: subject groups
  const h1 = ['S/N', 'Student ID', 'Student Name'];
  subjects.forEach(s => { h1.push(s, '', ''); });
  h1.push('Sum', 'Grade');

  // Row 2: sub-headers
  const h2 = ['', '', ''];
  subjects.forEach(() => { h2.push('CA/' + maxCA, 'Exam/' + maxExam, 'Total/' + maxSubj); });
  h2.push('', '');

  const rows = [h1, h2];
  tbl.querySelectorAll('tr.r').forEach((tr, i) => {
    const sid  = tr.dataset.sid;
    const name = tr.querySelector('.c1').textContent.trim();
    const line = [i + 1, sid, name];
    let sum = 0, n = 0;
    subjects.forEach((_, j) => {
      const ca  = tr.querySelector('input.ca[data-s="' + j + '"]');
      const ex  = tr.querySelector('input.ex[data-s="' + j + '"]');
      const tot = tr.querySelector('.tt[data-s="' + j + '"]');
      const cv  = ca ? (+ca.value || 0) : 0;
      const ev  = ex ? (+ex.value || 0) : 0;
      const tv  = cv + ev;
      if (tv > 0) { sum += tv; n++; }
      line.push(cv || '', ev || '', tv || '');
    });
    const maxPossible = n * maxSubj;
    const g = sum ? grade(sum, maxPossible) : '';
    line.push(sum || '', g);
    rows.push(line);
