<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Database — Tendercare School</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="students_db.js"></script>
  <style>
    :root {
      --primary-bg: #0a0a19;
      --secondary-bg: rgba(20,20,40,0.8);
      --card-bg: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.15);
      --text: #ffffff;
      --text-secondary: rgba(255,255,255,0.65);
      --text-muted: rgba(255,255,255,0.4);
      --blue: #3b82f6;
      --green: #22c55e;
      --purple: #8b5cf6;
      --orange: #f97316;
      --pink: #ec4899;
      --teal: #14b8a6;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-pill: 999px;
      --shadow: 0 8px 32px rgba(0,0,0,0.3);
      --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--primary-bg); color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(59,130,246,0.06) 0%, transparent 30%),
        radial-gradient(circle at 85% 90%, rgba(139,92,246,0.06) 0%, transparent 30%);
    }

    /* NAV */
    .nav {
      background: rgba(10,10,25,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem; position: sticky; top:0; z-index:100;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand { display: flex; align-items: center; gap: 0.75rem; }
    .nav-brand i { font-size: 1.4rem; color: var(--blue); }
    .nav-brand h1 {
      font-size: 1.25rem; font-weight: 700;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nav-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.1rem; }
    .nav-back {
      padding: 0.6rem 1.25rem; background: rgba(255,255,255,0.05);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-secondary); font-size: 0.9rem; font-weight: 500;
      cursor: pointer; transition: var(--transition); text-decoration: none;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .nav-back:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    /* LAYOUT */
    .container { max-width: 1300px; margin: 0 auto; padding: 2.5rem 2rem; }

    /* HEADER */
    .page-header { margin-bottom: 2.5rem; }
    .page-header h2 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    .page-header p { color: var(--text-secondary); font-size: 1rem; }

    /* STAT CARDS */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
      gap: 1rem; margin-bottom: 2.5rem;
    }
    .stat-card {
      background: var(--secondary-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem 1.5rem;
      transition: var(--transition);
    }
    .stat-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
    .stat-card-value { font-size: 2rem; font-weight: 700; line-height: 1; margin-bottom: 0.4rem; }
    .stat-card-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* CONTROLS */
    .controls {
      display: flex; gap: 1rem; margin-bottom: 1.75rem;
      flex-wrap: wrap; align-items: flex-start;
    }
    .search-wrap { flex: 1; min-width: 260px; position: relative; }
    .search-wrap i {
      position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 0.9rem;
    }
    .search-input {
      width: 100%; padding: 0.875rem 1rem 0.875rem 2.75rem; font-size: 0.95rem;
      background: var(--secondary-bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); transition: var(--transition);
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }

    .filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .filter-btn {
      padding: 0.6rem 1rem; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: var(--radius-pill);
      font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;
      transition: var(--transition); font-weight: 500; white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--border-hover); color: var(--text); background: rgba(255,255,255,0.06); }
    .filter-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    .export-btn {
      padding: 0.75rem 1.25rem; background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.3); border-radius: var(--radius-sm);
      font-size: 0.9rem; color: #4ade80; cursor: pointer;
      transition: var(--transition); font-weight: 600;
      display: flex; align-items: center; gap: 0.5rem; white-space: nowrap;
    }
    .export-btn:hover { background: rgba(34,197,94,0.25); transform: translateY(-1px); }

    /* RESULT COUNT */
    .result-info { margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-muted); }

    /* TABLE */
    .table-container {
      background: var(--secondary-bg); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 580px; }
    thead { background: rgba(0,0,0,0.25); }
    th {
      padding: 1rem 1.25rem; text-align: left; font-size: 0.78rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-secondary); border-bottom: 1px solid var(--border);
      cursor: pointer; user-select: none; white-space: nowrap;
      transition: var(--transition);
    }
    th:hover { color: var(--text); }
    th.sorted { color: var(--blue); }
    th .sort-icon { opacity: 0.4; margin-left: 4px; font-size: 0.75rem; }
    th.sorted .sort-icon { opacity: 1; }
    td {
      padding: 0.9rem 1.25rem; font-size: 0.95rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    tbody tr { transition: background var(--transition); }
    tbody tr:hover { background: rgba(255,255,255,0.025); }
    tbody tr:last-child td { border-bottom: none; }

    .student-id { font-family: 'Courier New', monospace; font-size: 0.78rem; color: var(--text-muted); }
    .student-name { font-weight: 500; }
    .student-num { font-size: 0.85rem; color: var(--text-muted); }

    /* CLASS BADGES */
    .badge {
      display: inline-block; padding: 0.3rem 0.75rem; border-radius: var(--radius-pill);
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
    }
    .badge-jss1 { background: rgba(20,184,166,0.12); color: #2dd4bf; border: 1px solid rgba(20,184,166,0.25); }
    .badge-jss2 { background: rgba(59,130,246,0.12); color: #60a5fa; border: 1px solid rgba(59,130,246,0.25); }
    .badge-jss3 { background: rgba(139,92,246,0.12); color: #a78bfa; border: 1px solid rgba(139,92,246,0.25); }
    .badge-ss1  { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
    .badge-ss2  { background: rgba(249,115,22,0.12); color: #fb923c; border: 1px solid rgba(249,115,22,0.25); }
    .badge-ss3  { background: rgba(236,72,153,0.12); color: #f472b6; border: 1px solid rgba(236,72,153,0.25); }

    /* STATUS */
    .status-badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.25rem 0.65rem; border-radius: var(--radius-pill);
      font-size: 0.75rem; font-weight: 600;
    }
    .status-active { background: rgba(34,197,94,0.1); color: #4ade80; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* EMPTY STATE */
    .empty-state {
      text-align: center; padding: 4rem 2rem; color: var(--text-muted);
    }
    .empty-state i { font-size: 2.5rem; margin-bottom: 1rem; display: block; opacity: 0.4; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .container { padding: 1.5rem 1rem; }
      .controls { flex-direction: column; }
      .filter-group { justify-content: flex-start; }
      .stats-grid { grid-template-columns: repeat(2,1fr); }
      .nav { padding: 1rem; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .page-header h2 { font-size: 1.5rem; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-brand">
      <i class="fas fa-database"></i>
      <div>
        <h1>Student Database</h1>
        <div class="nav-sub">Tendercare School &bull; 2025/2026</div>
      </div>
    </div>
    <a href="index.html" class="nav-back">
      <i class="fas fa-arrow-left"></i> Teacher Portal
    </a>
  </nav>

  <div class="container">

    <div class="page-header">
      <h2>Student Records</h2>
      <p>Official registry of all enrolled students — <span id="academicYear">2025/2026</span></p>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-value" id="statTotal">—</div>
        <div class="stat-card-label">Total Enrolled</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value" id="statJSS">—</div>
        <div class="stat-card-label">JSS Students</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value" id="statSS">—</div>
        <div class="stat-card-label">SS Students</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value" id="statClasses">—</div>
        <div class="stat-card-label">Active Classes</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value" id="statPending" style="color:#fb923c;">—</div>
        <div class="stat-card-label">Pending Enrolment</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" class="search-input" id="searchInput" placeholder="Search by name or student ID…">
      </div>
      <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" onclick="filterClass('all',this)">All</button>
        <!-- Class filter buttons injected by JS -->
      </div>
      <button class="export-btn" onclick="exportCSV()">
        <i class="fas fa-download"></i> Export CSV
      </button>
    </div>

    <div class="result-info" id="resultInfo"></div>

    <!-- Table -->
    <div class="table-container">
      <div class="table-wrap">
        <table id="studentTable">
          <thead>
            <tr>
              <th class="student-num" onclick="sortBy('num')">#</th>
              <th onclick="sortBy('name')">Student Name <i class="fas fa-sort sort-icon"></i></th>
              <th onclick="sortBy('id')">Student ID <i class="fas fa-sort sort-icon"></i></th>
              <th onclick="sortBy('class')">Class <i class="fas fa-sort sort-icon"></i></th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // ── Build flat student list from STUDENTS_DB ───────────
    let allStudents = [];
    let filteredStudents = [];
    let currentSort = { col: 'name', dir: 1 };
    let currentFilter = 'all';

    function buildStudentList() {
      allStudents = [];
      if (typeof STUDENTS_DB === 'undefined') return;
      for (const [className, students] of Object.entries(STUDENTS_DB)) {
        students.forEach(s => {
          allStudents.push({
            id: s.id,
            name: s.name,
            class: className,
            status: s.status || 'active'
          });
        });
      }
    }

    // ── Stats ──────────────────────────────────────────────
    function updateStats() {
      const total = allStudents.length;
      const jss   = allStudents.filter(s => s.class.startsWith('JSS')).length;
      const ss    = allStudents.filter(s => s.class.startsWith('SS')).length;
      const classes = typeof getClassNames === 'function' ? getClassNames().length : 0;
      const pending = allStudents.filter(s => s.class === 'SS1 Actuarial').length === 0 ? 1 : 0;

      document.getElementById('statTotal').textContent   = total;
      document.getElementById('statJSS').textContent     = jss;
      document.getElementById('statSS').textContent      = ss;
      document.getElementById('statClasses').textContent = classes;
      document.getElementById('statPending').textContent = pending ? '1 class' : '0';
    }

    // ── Filter buttons ────────────────────────────────────
    function buildFilters() {
      const group = document.getElementById('filterGroup');
      // Clear existing dynamic buttons (keep "All")
      Array.from(group.querySelectorAll('.filter-btn:not(:first-child)')).forEach(b => b.remove());

      const classNames = typeof getClassNames === 'function' ? getClassNames() : [];
      classNames.forEach(cls => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = cls;
        btn.onclick = () => filterClass(cls, btn);
        group.appendChild(btn);
      });
    }

    function filterClass(cls, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = cls;
      applyFiltersAndSort();
    }

    // ── Search ─────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('searchInput').addEventListener('input', () => applyFiltersAndSort());
    });

    // ── Sort ───────────────────────────────────────────────
    function sortBy(col) {
      if (currentSort.col === col) currentSort.dir *= -1;
      else { currentSort.col = col; currentSort.dir = 1; }
      document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));
      document.querySelectorAll('th').forEach(th => {
        if (th.textContent.toLowerCase().includes(col)) th.classList.add('sorted');
      });
      applyFiltersAndSort();
    }

    // ── Core render pipeline ───────────────────────────────
    function applyFiltersAndSort() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      filteredStudents = allStudents.filter(s => {
        const matchClass  = currentFilter === 'all' || s.class === currentFilter;
        const matchSearch = !query
          || s.name.toLowerCase().includes(query)
          || s.id.toLowerCase().includes(query)
          || s.class.toLowerCase().includes(query);
        return matchClass && matchSearch;
      });

      const { col, dir } = currentSort;
      filteredStudents.sort((a, b) => {
        const av = col === 'num' ? allStudents.indexOf(a) : (a[col] || '').toLowerCase();
        const bv = col === 'num' ? allStudents.indexOf(b) : (b[col] || '').toLowerCase();
        if (av < bv) return -1 * dir;
        if (av > bv) return  1 * dir;
        return 0;
      });

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      document.getElementById('resultInfo').textContent =
        `Showing ${filteredStudents.length} of ${allStudents.length} students`;

      if (filteredStudents.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="5">
            <div class="empty-state">
              <i class="fas fa-search"></i>
              No students match your search.
            </div>
          </td></tr>`;
        return;
      }

      tbody.innerHTML = filteredStudents.map((s, i) => {
        const globalNum = allStudents.indexOf(s) + 1;
        return `
          <tr>
            <td class="student-num">${globalNum}</td>
            <td class="student-name">${s.name}</td>
            <td class="student-id">${s.id}</td>
            <td><span class="badge ${getBadgeClass(s.class)}">${s.class}</span></td>
            <td>
              <span class="status-badge status-${s.status}">
                <span class="status-dot"></span>
                ${capitalize(s.status)}
              </span>
            </td>
          </tr>`;
      }).join('');
    }

    function getBadgeClass(cls) {
      if (cls.startsWith('JSS1')) return 'badge-jss1';
      if (cls.startsWith('JSS2')) return 'badge-jss2';
      if (cls.startsWith('JSS3')) return 'badge-jss3';
      if (cls.startsWith('SS1'))  return 'badge-ss1';
      if (cls.startsWith('SS2'))  return 'badge-ss2';
      if (cls.startsWith('SS3'))  return 'badge-ss3';
      return '';
    }

    function capitalize(str) {
      return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
    }

    // ── CSV Export ─────────────────────────────────────────
    function exportCSV() {
      const rows = [['#','Name','Student ID','Class','Status']];
      filteredStudents.forEach((s, i) => {
        rows.push([i + 1, s.name, s.id, s.class, s.status]);
      });
      const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const filter = currentFilter === 'all' ? 'all-classes' : currentFilter.replace(/\s/g, '-');
      a.download = `tendercare-students-${filter}-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    }

    // ── Init ───────────────────────────────────────────────
    buildStudentList();
    updateStats();
    buildFilters();
    applyFiltersAndSort();
  </script>

</body>
</html>
