<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tendercare — Admin Broadsheet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== TOKENS ===== */
    :root {
      --bg:        #0b0c14;
      --surface:   #12141f;
      --surface2:  #191c2d;
      --border:    rgba(255,255,255,.08);
      --border2:   rgba(255,255,255,.14);
      --accent:    #3b6fef;
      --accent2:   #5b8fff;
      --gold:      #f5c842;
      --green:     #22c55e;
      --red:       #ef4444;
      --amber:     #f59e0b;
      --text:      #e8eaf0;
      --muted:     rgba(232,234,240,.45);
      --radius:    10px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ===== HEADER ===== */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .app-header .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-header .brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 15px;
      color: #fff;
    }

    .app-header .brand-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .4px;
    }

    .app-header .brand-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== SELECTION SCREEN ===== */
    .selection-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 58px);
      padding: 32px 20px;
    }

    .selection-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 520px;
    }

    .selection-card h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .selection-card p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 32px;
    }

    .class-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }

    .class-group-label {
      grid-column: 1 / -1;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--muted);
      text-transform: uppercase;
      padding: 6px 0 2px;
    }

    .class-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      transition: all .18s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .class-btn .count {
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
    }

    .class-btn:hover {
      border-color: var(--accent);
      background: rgba(59,111,239,.1);
      color: var(--accent2);
    }

    /* ===== BROADSHEET SCREEN ===== */
    .broadsheet-screen {
      display: none;
      flex-direction: column;
      height: calc(100vh - 58px);
    }

    .broadsheet-screen.active {
      display: flex;
    }

    /* toolbar */
    .bs-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .bs-toolbar .class-title {
      font-size: 17px;
      font-weight: 700;
      flex: 1;
      min-width: 160px;
    }

    .bs-toolbar .term-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .4px;
    }

    /* score limits row */
    .limits-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 20px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .limit-field {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .limit-field input {
      width: 60px;
      background: var(--surface);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
    }

    .limits-row .stats {
      display: flex;
      gap: 20px;
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
    }

    .limits-row .stats span strong {
      color: var(--text);
    }

    /* scrollable table area */
    .table-scroll {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    /* ===== BROADSHEET TABLE ===== */
    .broadsheet-table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      min-width: 100%;
    }

    .broadsheet-table thead tr th {
      background: var(--surface);
      border-bottom: 2px solid var(--border2);
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 30;
      white-space: nowrap;
    }

    /* sticky left columns */
    .broadsheet-table th.col-sn,
    .broadsheet-table td.col-sn {
      position: sticky;
      left: 0;
      z-index: 20;
      background: var(--surface);
      width: 42px;
      min-width: 42px;
    }

    .broadsheet-table th.col-name,
    .broadsheet-table td.col-name {
      position: sticky;
      left: 42px;
      z-index: 20;
      background: var(--surface);
      width: 200px;
      min-width: 200px;
    }

    /* header cells */
    .th-subject {
      text-align: center;
    }

    .th-subject .subj-name {
      font-size: 11px;
      font-weight: 700;
      padding: 8px 6px 2px;
      color: var(--text);
      letter-spacing: .3px;
    }

    .th-subject .subj-cols {
      display: flex;
      border-top: 1px solid var(--border);
    }

    .th-subject .subj-cols span {
      flex: 1;
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      padding: 3px 4px;
      border-right: 1px solid var(--border);
    }

    .th-subject .subj-cols span:last-child {
      border-right: none;
    }

    .th-plain {
      font-size: 11px;
      font-weight: 700;
      padding: 14px 10px;
      text-align: center;
      color: var(--muted);
      vertical-align: bottom;
    }

    .th-sno {
      font-size: 10px;
      padding: 14px 8px;
      text-align: center;
      color: var(--muted);
      vertical-align: bottom;
    }

    /* body rows */
    .broadsheet-table tbody tr {
      transition: background .1s;
    }

    .broadsheet-table tbody tr:hover td {
      background: rgba(59,111,239,.07) !important;
    }

    .broadsheet-table tbody tr:hover td.col-sn,
    .broadsheet-table tbody tr:hover td.col-name {
      background: rgba(59,111,239,.12) !important;
    }

    .broadsheet-table td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 0;
      vertical-align: middle;
    }

    .broadsheet-table td.col-sn {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 6px;
    }

    .broadsheet-table td.col-name {
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 500;
      border-right: 2px solid var(--border2);
    }

    /* subject cell group: 3 sub-cells */
    .subject-group {
      display: flex;
    }

    .subject-group .sc-input {
      flex: 1;
      border: none;
      border-right: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 12px;
      text-align: center;
      padding: 5px 3px;
      width: 46px;
      min-width: 46px;
      transition: background .1s;
      outline: none;
    }

    .subject-group .sc-input:focus {
      background: rgba(59,111,239,.15);
    }

    .subject-group .sc-input.over-limit {
      background: rgba(239,68,68,.18) !important;
      color: #fca5a5;
    }

    .subject-group .sc-total {
      flex: 0 0 44px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 4px;
      color: var(--text);
      border-right: 2px solid var(--border2);
      background: rgba(255,255,255,.025);
    }

    /* summary cells */
    .td-total {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 8px;
      color: #fff;
      min-width: 56px;
    }

    .td-grade {
      text-align: center;
      padding: 5px 8px;
      min-width: 46px;
    }

    .grade-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: .4px;
    }

    .grade-a1 { background: rgba(34,197,94,.18); color: #4ade80; }
    .grade-b2, .grade-b3 { background: rgba(91,143,255,.18); color: #93c5fd; }
    .grade-c4, .grade-c5, .grade-c6 { background: rgba(245,200,66,.14); color: #fde047; }
    .grade-d7 { background: rgba(245,158,11,.14); color: #fbbf24; }
    .grade-e8 { background: rgba(239,100,44,.16); color: #f97316; }
    .grade-f9 { background: rgba(239,68,68,.16); color: #f87171; }
    .grade-na { background: rgba(255,255,255,.06); color: var(--muted); }

    /* subject group separators */
    .subj-border-right {
      border-right: 2px solid var(--border2) !important;
    }

    /* ===== ACTION BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border: 1px solid var(--border2);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
      background: transparent;
      color: var(--text);
      white-space: nowrap;
    }

    .btn:hover { border-color: var(--accent2); color: var(--accent2); }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent2);
      border-color: var(--accent2);
      color: #fff;
    }

    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }

    .btn-ghost:hover {
      border-color: var(--border2);
      color: var(--text);
    }

    /* ===== SAVE INDICATOR ===== */
    .save-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      margin-right: 4px;
      transition: background .3s;
    }

    .save-dot.dirty { background: var(--amber); }

    /* ===== NOTIFICATION TOAST ===== */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(80px);
      opacity: 0;
      transition: all .25s;
      z-index: 999;
      max-width: 340px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success { border-left: 3px solid var(--green); }
    .toast.error   { border-left: 3px solid var(--red); }
    .toast.info    { border-left: 3px solid var(--accent2); }

    /* ===== SUBJECT LEGEND ===== */
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .legend-item {
      font-size: 10px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .selection-card { padding: 24px 18px; }
      .class-grid { grid-template-columns: 1fr; }
      .bs-toolbar { padding: 10px 12px; }
    }
  </style>
</head>

</div>

<!-- ===== BROADSHEET SCREEN ===== -->
<div class="broadsheet-screen" id="broadsheetScreen">

  <div class="bs-toolbar">
    <button class="btn btn-ghost" onclick="backToSelection()">
      <i class="fas fa-arrow-left"></i> Classes

    <div class="class-title" id="bsClassTitle">—</div>
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);">
      <span class="save-dot" id="saveDot"></span>
      <span id="saveLabel">Saved</span>
    </div>
    <button class="btn" onclick="saveToStorage()">
      <i class="fas fa-save"></i> Save
    </button>
    <button class="btn" onclick="clearClass()">
      <i class="fas fa-eraser"></i> Clear
    </button>
    <button class="btn btn-primary" onclick="exportCSV()">
      <i class="fas fa-download"></i> Export CSV
    </button>
  </div>

  <!-- limits + stats -->
  <div class="limits-row">
    <div class="limit-field">
      CA max: <input type="number" id="maxCA" value="30" min="1" max="100" onchange="recalcAll()">
    </div>
    <div class="limit-field">
      Exam max: <input type="number" id="maxExam" value="70" min="1" max="100" onchange="recalcAll()">
    </div>
    <div class="stats" id="bsStats">
      <span><strong id="statStudents">0</strong> students</span>
      <span>Avg <strong id="statAvg">—</strong></span>
      <span>High <strong id="statHigh">—</strong></span>
      <span>Low <strong id="statLow">—</strong></span>
    </div>
  </div>

  <!-- subject legend -->
  <div class="legend-bar" id="legendBar"></div>

  <!-- scrollable table -->
  <div class="table-scroll">
    <table class="broadsheet-table" id="broadsheetTable">
      <thead><tr id="tableHeader"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

// ============================================================
// STATE
// ============================================================
let currentClass = null;
let currentSubjects = [];
let students = [];
// scores[studentId][subject] = { ca: 0, exam: 0 }
let scores = {};
let dirty = false;

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  // populate count badges
  for (const [cls, studs] of Object.entries(STUDENTS)) {
    const key = cls.replace(/ /g, '_');
    const el = document.getElementById('cnt-' + key);
    if (el) el.textContent = studs.length + ' students';
  }
});

// ============================================================
// NAVIGATION
// ============================================================
function openBroadsheet(className) {
  currentClass = className;
  currentSubjects = CLASS_SUBJECTS[className] || [];
  students = STUDENTS[className] || [];

  // Load saved scores
  loadScores();

  // Update UI
  document.getElementById('bsClassTitle').textContent = className + ' — Broadsheet';
  document.getElementById('statStudents').textContent = students.length;

  document.getElementById('selectionScreen').style.display = 'none';
  const bs = document.getElementById('broadsheetScreen');
  bs.style.display = 'flex';
  bs.classList.add('active');

  renderHeader();
  renderLegend();
  renderBody();
  updateStats();
  markClean();
}

function backToSelection() {
  if (dirty && !confirm('You have unsaved changes. Leave without saving?')) return;
  document.getElementById('broadsheetScreen').classList.remove('active');
  document.getElementById('broadsheetScreen').style.display = 'none';
  document.getElementById('selectionScreen').style.display = 'flex';
  currentClass = null;
}

// ============================================================
// RENDER HEADER
// ============================================================
function renderHeader() {
  const tr = document.getElementById('tableHeader');
  tr.innerHTML = '';

  // S/N
  const thSn = document.createElement('th');
  thSn.className = 'col-sn';
  thSn.innerHTML = '<div class="th-sno">S/N</div>';
  tr.appendChild(thSn);

  // Name
  const thName = document.createElement('th');
  thName.className = 'col-name';
  thName.innerHTML = '<div class="th-plain">Student Name</div>';
  tr.appendChild(thName);

  // Subject columns
  currentSubjects.forEach(subj => {
    const th = document.createElement('th');
    th.className = 'th-subject';
    th.innerHTML = `
      <div class="subj-name">${subj}</div>
      <div class="subj-cols">
        <span>CA</span>
        <span>Exam</span>
        <span>Total</span>
      </div>`;
    tr.appendChild(th);
  });

  // Aggregate columns
  const thAgg = document.createElement('th');
  thAgg.innerHTML = '<div class="th-plain">Sum</div>';
  tr.appendChild(thAgg);

  const thGrade = document.createElement('th');
  thGrade.innerHTML = '<div class="th-plain">Grade</div>';
  tr.appendChild(thGrade);
}

// ============================================================
// RENDER LEGEND
// ============================================================
function renderLegend() {
  const lb = document.getElementById('legendBar');
  lb.innerHTML = currentSubjects.map((s, i) => `<span class="legend-item">${i+1}. ${s}</span>`).join('');
}

// ============================================================
// RENDER BODY
// ============================================================
function renderBody() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  students.forEach((student, idx) => {
    const tr = document.createElement('tr');

    // S/N
    const tdSn = document.createElement('td');
    tdSn.className = 'col-sn';
    tdSn.textContent = idx + 1;
    tr.appendChild(tdSn);

    // Name
    const tdName = document.createElement('td');
    tdName.className = 'col-name';
    tdName.textContent = student.name;
    tr.appendChild(tdName);

    // Subject cells
    currentSubjects.forEach(subj => {
      const sc = getScore(student.id, subj);
      const total = sc.ca + sc.exam;

      const td = document.createElement('td');
      const div = document.createElement('div');
      div.className = 'subject-group';
      div.innerHTML = `
        <input type="number" class="sc-input" min="0" max="${getMaxCA()}"
               value="${sc.ca || ''}" placeholder="0"
               data-sid="${student.id}" data-subj="${subj}" data-field="ca"
               onchange="onScoreChange(this)" oninput="validateInput(this)">
        <input type="number" class="sc-input" min="0" max="${getMaxExam()}"
               value="${sc.exam || ''}" placeholder="0"
               data-sid="${student.id}" data-subj="${subj}" data-field="exam"
               onchange="onScoreChange(this)" oninput="validateInput(this)">
        <div class="sc-total" data-sid="${student.id}" data-subj="${subj}" data-role="total">
          ${total > 0 ? total : ''}
        </div>`;
      td.appendChild(div);
      tr.appendChild(td);
    });

    // Aggregate total
    const tdTotal = document.createElement('td');
    tdTotal.className = 'td-total';
    tdTotal.setAttribute('data-sid', student.id);
    tdTotal.setAttribute('data-role', 'sum');
    tr.appendChild(tdTotal);

    // Grade
    const tdGrade = document.createElement('td');
    tdGrade.className = 'td-grade';
    tdGrade.setAttribute('data-sid', student.id);
    tdGrade.setAttribute('data-role', 'grade');
    tr.appendChild(tdGrade);

    tbody.appendChild(tr);
    updateRowAgg(student.id);
  });
}

// ============================================================
// SCORE MANAGEMENT
// ============================================================
function getScore(sid, subj) {
  if (!scores[sid]) scores[sid] = {};
  if (!scores[sid][subj]) scores[sid][subj] = { ca: 0, exam: 0 };
  return scores[sid][subj];
}

function getMaxCA()   { return parseFloat(document.getElementById('maxCA').value) || 30; }
function getMaxExam() { return parseFloat(document.getElementById('maxExam').value) || 70; }
function getMaxTotal(){ return getMaxCA() + getMaxExam(); }

function validateInput(input) {
  const max = input.dataset.field === 'ca' ? getMaxCA() : getMaxExam();
  const val = parseFloat(input.value);
  input.classList.toggle('over-limit', !isNaN(val) && val > max);
}

function onScoreChange(input) {
  const sid   = input.dataset.sid;
  const subj  = input.dataset.subj;
  const field = input.dataset.field;
  const val   = Math.max(0, parseFloat(input.value) || 0);

  if (!scores[sid]) scores[sid] = {};
  if (!scores[sid][subj]) scores[sid][subj] = { ca: 0, exam: 0 };
  scores[sid][subj][field] = val;

  // Update subject total cell
  const sc = scores[sid][subj];
  const t = sc.ca + sc.exam;
  const totalCell = document.querySelector(`.sc-total[data-sid="${sid}"][data-subj="${subj}"]`);
  if (totalCell) totalCell.textContent = t > 0 ? t : '';

  updateRowAgg(sid);
  updateStats();
  markDirty();
}

function updateRowAgg(sid) {
  let sum = 0;
  currentSubjects.forEach(subj => {
    const sc = getScore(sid, subj);
    sum += sc.ca + sc.exam;
  });

  const sumCell = document.querySelector(`.td-total[data-sid="${sid}"]`);
  if (sumCell) sumCell.textContent = sum > 0 ? sum : '—';

  const gradeCell = document.querySelector(`.td-grade[data-sid="${sid}"]`);
  if (gradeCell) {
    const subjectCount = currentSubjects.length;
    const maxPossible = subjectCount * getMaxTotal();
    const grade = sum > 0 ? getNigerianGrade(sum, maxPossible) : '—';
    const cls = sum > 0 ? 'grade-' + grade.toLowerCase() : 'grade-na';
    gradeCell.innerHTML = `<span class="grade-pill ${cls}">${grade}</span>`;
  }
}

function recalcAll() {
  students.forEach(s => {
    // revalidate all inputs for this student
    const inputs = document.querySelectorAll(`input[data-sid="${s.id}"]`);
    inputs.forEach(validateInput);
    updateRowAgg(s.id);

    // also update subject totals
    currentSubjects.forEach(subj => {
      const sc = getScore(s.id, subj);
      const t = sc.ca + sc.exam;
      const totalCell = document.querySelector(`.sc-total[data-sid="${s.id}"][data-subj="${subj}"]`);
      if (totalCell) totalCell.textContent = t > 0 ? t : '';
    });
  });
  updateStats();
}

// ============================================================
// GRADING (Nigerian WAEC scale)
// ============================================================
function getNigerianGrade(score, maxPossible) {
  const pct = maxPossible > 0 ? (score / maxPossible) * 100 : 0;
  if (pct >= 75) return 'A1';
  if (pct >= 70) return 'B2';
  if (pct >= 65) return 'B3';
  if (pct >= 60) return 'C4';
  if (pct >= 55) return 'C5';
  if (pct >= 50) return 'C6';
  if (pct >= 45) return 'D7';
  if (pct >= 40) return 'E8';
  return 'F9';
}

// grade per individual subject (30+70=100 max → use raw total)
function getSubjectGrade(total) {
  const maxT = getMaxTotal();
  return getNigerianGrade(total, maxT);
}

// ============================================================
// STATS
// ============================================================
function updateStats() {
  const sums = students.map(s => {
    let sum = 0;
    currentSubjects.forEach(subj => {
      const sc = getScore(s.id, subj);
      sum += sc.ca + sc.exam;
    });
    return sum;
  }).filter(v => v > 0);

  if (sums.length === 0) {
    document.getElementById('statAvg').textContent = '—';
    document.getElementById('statHigh').textContent = '—';
    document.getElementById('statLow').textContent = '—';
    return;
  }

  const avg = (sums.reduce((a,b)=>a+b,0) / sums.length).toFixed(1);
  document.getElementById('statAvg').textContent = avg;
  document.getElementById('statHigh').textContent = Math.max(...sums);
  document.getElementById('statLow').textContent = Math.min(...sums);
}

// ============================================================
// DIRTY STATE
// ============================================================
function markDirty() {
  dirty = true;
  document.getElementById('saveDot').className = 'save-dot dirty';
  document.getElementById('saveLabel').textContent = 'Unsaved';
}

function markClean() {
  dirty = false;
  document.getElementById('saveDot').className = 'save-dot';
  document.getElementById('saveLabel').textContent = 'Saved';
}

// ============================================================
// PERSISTENCE
// ============================================================
function saveToStorage() {
  if (!currentClass) return;
  const key = 'broadsheet:' + currentClass;
  try {
    localStorage.setItem(key, JSON.stringify({ scores, maxCA: getMaxCA(), maxExam: getMaxExam() }));
    markClean();
    toast('Saved to browser storage.', 'success');
  } catch(e) {
    toast('Save failed — browser storage may be full.', 'error');
  }
}

function loadScores() {
  scores = {};
  const key = 'broadsheet:' + currentClass;
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const parsed = JSON.parse(raw);
      scores = parsed.scores || {};
      if (parsed.maxCA)   document.getElementById('maxCA').value = parsed.maxCA;
      if (parsed.maxExam) document.getElementById('maxExam').value = parsed.maxExam;
    }
  } catch(e) { scores = {}; }
}

function clearClass() {
  if (!confirm(`Clear ALL scores for ${currentClass}?`)) return;
  scores = {};
  renderBody();
  updateStats();
  markDirty();
  toast('All scores cleared.', 'info');
}

// ============================================================
// CSV EXPORT
// ============================================================
function exportCSV() {
  const rows = [];
  const maxCA   = getMaxCA();
  const maxExam = getMaxExam();
  const maxTotal = maxCA + maxExam;

  // Header row 1: subject names spanning 3 columns each
  const h1 = ['S/N', 'Student ID', 'Student Name'];
  currentSubjects.forEach(subj => { h1.push(subj, '', ''); });
  h1.push('Sum of Totals', 'Overall Grade');
  rows.push(h1);

  // Header row 2: CA / Exam / Total sub-headers
  const h2 = ['', '', ''];
  currentSubjects.forEach(() => { h2.push('CA', 'Exam', 'Total'); });
  h2.push('', '');
  rows.push(h2);

  // Max row
  const hMax = ['', '', 'Max →'];
  currentSubjects.forEach(() => { hMax.push(maxCA, maxExam, maxTotal); });
  hMax.push('', '');
  rows.push(hMax);

  // Student rows
  students.forEach((s, idx) => {
    let sum = 0;
    const row = [idx + 1, s.id, s.name];
    currentSubjects.forEach(subj => {
      const sc = getScore(s.id, subj);
      const t = sc.ca + sc.exam;
      sum += t;
      row.push(sc.ca || '', sc.exam || '', t || '');
    });
    const maxPossible = currentSubjects.length * maxTotal;
    const grade = sum > 0 ? getNigerianGrade(sum, maxPossible) : '';
    row.push(sum || '', grade);
    rows.push(row);
  });

  const csvContent = rows.map(r =>
    r.map(cell => {
      const s = String(cell).replace(/"/g, '""');
      return /[,"\n]/.test(s) ? `"${s}"` : s;
    }).join(',')
  ).join('\n');

  const bom = '\uFEFF'; // UTF-8 BOM for Excel compatibility
  const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `broadsheet_${currentClass.replace(/ /g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  saveToStorage();
  toast(`CSV exported — ${students.length} students, ${currentSubjects.length} subjects.`, 'success');
}

// ============================================================
// TOAST
// ============================================================
let toastTimer = null;
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.className = 'toast ' + type;
  const icons = { success: 'check-circle', error: 'exclamation-circle', info: 'info-circle' };
  el.innerHTML = `<i class="fas fa-${icons[type] || 'bell'}"></i> ${msg}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ============================================================
// KEYBOARD: Tab between score inputs left-to-right, top-to-bottom
// ============================================================
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const inputs = Array.from(document.querySelectorAll('.sc-input'));
  const idx = inputs.indexOf(document.activeElement);
  if (idx >= 0 && idx < inputs.length - 1) {
    e.preventDefault();
    inputs[idx + 1].focus();
    inputs[idx + 1].select();
  }
});

// Auto-save every 60s if dirty
setInterval(() => { if (dirty) saveToStorage(); }, 60000);
</script>
